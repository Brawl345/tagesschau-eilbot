name: Build
on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAME: tagesschau-eilbot

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    strategy:
      matrix:
        GOOS: [windows, linux, darwin]
        GOARCH: [amd64, 386, arm, arm64]
        exclude:
          - GOOS: windows
            GOARCH: arm
          - GOOS: darwin
            GOARCH: 386
          - GOOS: darwin
            GOARCH: arm

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -buildid=" -o "dist/$NAME-$GOOS-$GOARCH"

      - name: Rename binaries (Windows)
        if: matrix.GOOS == 'windows'
        run: for x in dist/"$NAME"-windows-*; do mv "$x" "$x.exe"; done

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}-${{ matrix.GOOS }}-${{ matrix.GOARCH }}-${{ github.sha }}
          path: dist/*
          retention-days: 90

  docker:
    name: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push image to ghcr.io

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build . --file Dockerfile --tag "$NAME" --label "runnumber=$GITHUB_RUN_ID"

      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$NAME"
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == "master" ]] && VERSION=latest
          echo "IMAGE_ID=$IMAGE_ID"
          echo "VERSION=$VERSION"
          docker tag "$NAME" "$IMAGE_ID:$VERSION"
          docker push "$IMAGE_ID:$VERSION"
